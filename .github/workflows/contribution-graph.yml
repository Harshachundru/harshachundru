name: generate-contribution-graph

on:
  schedule:
    - cron: "0 18 * * *" # nightly, matches the old profile-3d-contrib schedule
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate contribution-graph.svg
        env:
          CONTRIB_TOKEN: ${{ secrets.myprofile_workflow }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-contribution-graph.js
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add contribution-graph.svg
          git diff --staged --quiet || git commit -m "chore: regenerate contribution terrain"
          git push
