name: generate-tech-stack-rings

on:
  push:
    branches: [main]
    paths:
      - "tech-stack.json"
      - "scripts/generate-tech-stack-svg.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate tech-stack-rings.svg from tech-stack.json
        run: node scripts/generate-tech-stack-svg.js
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tech-stack-rings.svg
          git diff --staged --quiet || git commit -m "chore: regenerate tech stack rings"
          git push
